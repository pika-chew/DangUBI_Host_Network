---
# 호스트 현재 상태 점검 (읽기 전용)
# 실행: ansible-playbook playbooks/verify.yml
# 점검 내용은 roles/verify_network/tasks/, roles/verify_base/tasks/ 아래 파일별로 나뉘어 있음

- name: Verify host network
  hosts: all
  gather_facts: true        # facts 수집 → ansible_default_ipv4 같은 변수가 생김
  check_mode: false         # --check로 돌려도 조회는 실제로 실행 (읽기 전용이라 안전)
  roles:
    - verify_network

- name: Verify host base settings
  hosts: all
  gather_facts: true        # ansible_facts['hostname'] 사용
  check_mode: false
  roles:
    - verify_base
