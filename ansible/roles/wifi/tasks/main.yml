---
# 🚨 NetworkManager restart/reload, nmcli con up/down, nmcli device disconnect 를 하지 않는다.
#    Wi-Fi 는 Ansible 접속 경로(Tailscale)라서 끊으면 플레이북이 중간에 멈춘다.

- name: wifi | iw package installed
  ansible.builtin.apt:
    name: iw
    state: present
  register: wifi_iw_pkg

- name: wifi | NetworkManager default powersave drop-in
  ansible.builtin.copy:
    dest: "{{ wifi_nm_conf_path }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (roles/wifi)
      # 프로필에 값이 없을 때 쓰는 기본값. NetworkManager 재시작 없이 두고 재부팅 뒤 적용된다.
      [connection]
      wifi.powersave = {{ wifi_powersave }}

- name: wifi | get active connection on uplink
  ansible.builtin.command:
    argv: [nmcli, -g, GENERAL.CONNECTION, device, show, "{{ wifi_if }}"]
  register: wifi_conn
  changed_when: false
  check_mode: false

- name: wifi | assert uplink is connected
  ansible.builtin.assert:
    that:
      - wifi_conn.stdout | trim | length > 0
    fail_msg: "{{ wifi_if }} 에 활성 프로필이 없습니다. Wi-Fi 를 먼저 연결한 뒤 다시 실행하세요."
    quiet: true

- name: wifi | get profile settings
  ansible.builtin.command:
    argv:
      - nmcli
      - -g
      - 802-11-wireless.powersave,connection.autoconnect-retries
      - connection
      - show
      - "{{ wifi_conn.stdout | trim }}"
  register: wifi_profile
  changed_when: false
  check_mode: false

# nmcli 버전에 따라 "2", "2 (disable)", "disable" 처럼 출력이 달라서 앞부분만 비교한다
- name: wifi | profile powersave off and infinite autoconnect retries
  ansible.builtin.command:
    argv:
      - nmcli
      - connection
      - modify
      - "{{ wifi_conn.stdout | trim }}"
      - 802-11-wireless.powersave
      - "{{ wifi_powersave }}"
      - connection.autoconnect-retries
      - "{{ wifi_autoconnect_retries }}"
  changed_when: true
  when: >-
    (wifi_profile.stdout_lines | length < 2)
    or not (wifi_profile.stdout_lines[0] is match('^(' ~ wifi_powersave ~ '( |$)|disable)'))
    or not (wifi_profile.stdout_lines[1] is match('^' ~ wifi_autoconnect_retries ~ '( |$)'))

# 프로필 값은 다음 연결부터 적용되므로, 지금 연결에는 드라이버 절전을 바로 끈다 (연결은 끊기지 않음)
- name: wifi | get runtime power save
  ansible.builtin.command:
    argv: [iw, dev, "{{ wifi_if }}", get, power_save]
  register: wifi_runtime_ps
  changed_when: false
  check_mode: false
  when: not (ansible_check_mode and wifi_iw_pkg is changed)

- name: wifi | runtime power save off
  ansible.builtin.command:
    argv: [iw, dev, "{{ wifi_if }}", set, power_save, "off"]
  changed_when: true
  when:
    - wifi_runtime_ps is not skipped
    - "'Power save: on' in wifi_runtime_ps.stdout"
