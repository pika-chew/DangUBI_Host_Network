---
# ufw 비활성화
# ufw 는 iptables 규칙을 자체적으로 덮어써 Kolla(Neutron, Docker)가 만든 규칙·NAT 와 충돌한다.
# 서비스 disable 까지는 하지 않는다 (ufw 가 inactive 면 부팅 시에도 규칙을 적용하지 않음).

# 왜: ufw 가 설치되지 않은 노드에서 ufw 모듈을 호출하면 "ufw 명령 없음"으로 실패한다.
# 설치 여부를 먼저 확인해 미설치 노드는 건너뛴다. 조회만 하므로 check 모드에서도 실행된다.
- name: ufw | gather installed packages
  ansible.builtin.package_facts:
    manager: auto

# 왜: ufw 가 켜져 있으면 Kolla 서비스 포트·VM 트래픽이 막히거나 NAT 규칙이 꼬인다.
# 이미 inactive 면 ok(변경 없음). check 모드에서는 상태만 비교한다.
- name: ufw | disabled
  community.general.ufw:
    state: disabled
  when: "'ufw' in ansible_facts.packages"
