---
# /etc/hosts
#  - 127.0.1.1 줄이 없어야 한다
#  - 모든 노드의 "mgmt_ip 호스트명" 매핑이 있어야 한다 (groups['all'] 기준)
#
# 주의: 이미 손으로 추가한 4줄(tee -a, 마커 없음)과 Kolla bootstrap-servers 가 만든
# "# BEGIN/END ANSIBLE GENERATED HOSTS" 블록이 함께 있을 수 있다.
#  - Kolla 블록은 절대 수정하지 않는다 → 정규식으로 기존 줄을 "치환"하지 않는다.
#  - blockinfile 은 쓰지 않는다 (기존 4줄과 중복되는 새 블록이 생김).
#  - 매핑이 어디에든(우리 줄이든 Kolla 블록이든) 이미 있으면 아무것도 하지 않고,
#    완전히 없을 때만 파일 끝에 한 줄 추가한다.
#  - 같은 호스트명이 다른 IP로 매핑돼 있으면 임의로 고치지 않고 실패 → 사람이 판단.

# 왜: 아래 판단(중복/충돌/누락)을 하려면 현재 파일 전체가 필요하다. 읽기만 하므로 check 모드에서도 실행된다.
- name: /etc/hosts | read current content
  ansible.builtin.slurp:
    src: /etc/hosts
  register: base_hosts_raw

- name: /etc/hosts | parse lines
  ansible.builtin.set_fact:
    # 주석·빈 줄은 판단에서 뺀다. 127.0.1.1 줄은 어차피 지울 것이라 충돌 판단에서 뺀다.
    base_hosts_lines: >-
      {{ (base_hosts_raw.content | b64decode).splitlines()
         | reject('match', '^\s*(#|$)')
         | reject('match', '^\s*127\.0\.1\.1(\s|$)')
         | list }}

# 왜: 호스트명이 mgmt_ip 가 아닌 다른 IP로도 매핑돼 있으면 어느 쪽이 맞는지 코드가 판단할 수 없다.
# 빠지면: 잘못된 줄이 남아 있는데도 "정상"으로 보이고, getent 결과가 노드마다 달라질 수 있다.
- name: /etc/hosts | assert no conflicting mappings
  ansible.builtin.assert:
    that:
      - base_hosts_conflicts | length == 0
    success_msg: "{{ item }}: 다른 IP 매핑 없음"
    fail_msg: >-
      {{ item }} 이(가) mgmt_ip({{ hostvars[item].mgmt_ip }}) 가 아닌 주소로도 매핑돼 있습니다:
      {{ base_hosts_conflicts }}. 자동으로 정리하지 않습니다. 어느 줄을 남길지 결정해 주세요.
  loop: "{{ groups['all'] }}"
  vars:
    base_hosts_conflicts: >-
      {{ base_hosts_lines
         | select('search', '\s' ~ (item | regex_escape) ~ '(\s|$)')
         | reject('match', '^\s*' ~ (hostvars[item].mgmt_ip | regex_escape) ~ '\s')
         | list }}

# 왜: 같은 매핑이 두 번 이상(우리 줄 + Kolla 블록 등) 있으면 동작엔 문제가 없지만 정리 방식은 사람이 정한다.
# 실패시키지 않고 보고만 한다.
- name: /etc/hosts | report duplicated mappings
  ansible.builtin.debug:
    msg: >-
      {{ item }} 매핑이 {{ base_hosts_matches | length }}줄 있습니다: {{ base_hosts_matches }}.
      (예: 수동 추가 줄 + Kolla 블록) 그대로 두며, 정리 방식은 결정이 필요합니다.
  loop: "{{ groups['all'] }}"
  when: base_hosts_matches | length > 1
  vars:
    base_hosts_matches: >-
      {{ base_hosts_lines
         | select('match', '^\s*' ~ (hostvars[item].mgmt_ip | regex_escape) ~ '\s+(\S+\s+)*'
                            ~ (item | regex_escape) ~ '(\s|$)')
         | list }}

# 왜: Ubuntu 기본 "127.0.1.1 <호스트명>" 줄이 있으면 RabbitMQ·Kolla 가 자기 호스트명을 루프백으로 해석해
# 다른 노드가 접속하지 못하는 주소로 클러스터에 참여한다.
- name: /etc/hosts | 127.0.1.1 line is absent
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1(\s|$)'
    state: absent

# 왜: 노드끼리 호스트명으로 관리망 IP를 찾아야 Kolla 서비스·RabbitMQ 가 관리망으로 통신한다.
# regexp 없이 line 만 주면 "정확히 같은 줄이 없을 때 파일 끝에 추가"만 하고 다른 줄은 건드리지 않는다.
# 다른 형식(별칭 포함 등)으로 이미 매핑돼 있으면 when 조건으로 건너뛴다.
- name: /etc/hosts | mgmt_ip mapping exists for every node
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ hostvars[item].mgmt_ip }} {{ item }}"
  loop: "{{ groups['all'] }}"
  when: base_hosts_matches | length == 0
  vars:
    base_hosts_matches: >-
      {{ base_hosts_lines
         | select('match', '^\s*' ~ (hostvars[item].mgmt_ip | regex_escape) ~ '\s+(\S+\s+)*'
                            ~ (item | regex_escape) ~ '(\s|$)')
         | list }}
