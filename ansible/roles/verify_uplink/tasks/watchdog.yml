---
- name: watchdog | get timer state
  ansible.builtin.command: systemctl is-active net-watchdog.timer
  register: watchdog_timer
  changed_when: false
  failed_when: false       # inactive 면 rc≠0

- name: watchdog | get last run result
  ansible.builtin.command: systemctl show net-watchdog.service -p Result --value
  register: watchdog_result
  changed_when: false

# 연속 실패 횟수 파일이 있으면 지금 업링크 ping 이 실패하고 있다는 뜻
- name: watchdog | get current failure count
  ansible.builtin.slurp:
    src: /run/net-watchdog/fails
  register: watchdog_fails
  failed_when: false

- name: watchdog | assert timer active and uplink healthy
  ansible.builtin.assert:
    that:
      - watchdog_timer.stdout == 'active'
      - watchdog_result.stdout == 'success'
      - watchdog_fails.content is not defined
    success_msg: "net-watchdog.timer active, 마지막 실행 success, 업링크 정상"
    fail_msg: >-
      net-watchdog.timer = {{ watchdog_timer.stdout }},
      마지막 실행 = {{ watchdog_result.stdout }},
      연속 실패 = {{ (watchdog_fails.content | b64decode | trim) if watchdog_fails.content is defined else 0 }}
      (로그: journalctl -u net-watchdog.service)
