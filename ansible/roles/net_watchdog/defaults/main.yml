---
# 업링크(Wi-Fi) 감시·자가 복구 + Slack 알림
# 🚨 watchdog 은 Wi-Fi 장치만 다시 연결한다. NetworkManager 재시작, br-mgmt·veth 조작, 재부팅은 하지 않는다.

net_watchdog_if: "{{ uplink_if }}"

# 이 중 하나라도 ping 이 되면 정상으로 본다 (업링크 인터페이스로만 보냄)
net_watchdog_targets:
  - 1.1.1.1
  - 8.8.8.8

net_watchdog_interval: 1min      # 점검 주기 (systemd timer OnUnitActiveSec)
net_watchdog_fail_threshold: 3   # 연속 실패 N회면 끊김으로 판단 → Slack 경고 + 첫 재연결
net_watchdog_reconnect_every: 5  # 끊긴 동안 N회 점검마다 재연결 재시도 (너무 자주 끊어 연결 중인 것을 방해하지 않게)
net_watchdog_nmcli_wait: 30      # 재연결 명령의 최대 대기 시간(초)

# 빈 문자열이면 Slack 알림 없이 자가 복구만 한다.
# 값은 HashiCorp Vault dangubi/uplink 의 slack_webhook_url (playbooks/uplink.yml 이 읽음)
net_watchdog_slack_webhook_url: "{{ vault_slack_webhook_url | default('') }}"

net_watchdog_script_path: /usr/local/sbin/net-watchdog
net_watchdog_env_path: /etc/net-watchdog.env
