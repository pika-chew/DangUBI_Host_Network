---
# Vault 비밀값 템플릿
# 사용법:
#   cp vars/vault.example.yml vars/vault.yml      # <...> 를 실제 값으로 채운다
#   ansible-vault encrypt vars/vault.yml          # 암호화 (vault 비밀번호 입력)
#   ansible-vault edit vars/vault.yml             # 나중에 값 수정
# vault.yml 은 암호화해도 커밋하지 않는다 (.gitignore).
# 이 파일을 읽는 플레이북: playbooks/uplink.yml (vars_files)

# Slack Incoming Webhook URL. net_watchdog 이 업링크 끊김·복구를 알린다.
# 빈 문자열이면 Slack 알림 없이 자가 복구만 한다.
vault_slack_webhook_url: "https://hooks.slack.com/services/<T...>/<B...>/<secret>"

# healthchecks.io 프로젝트의 Ping key (Project Settings → Ping key).
# 노드마다 https://hc-ping.com/<ping-key>/<inventory_hostname>?create=1 로 핑한다.
# 처음 핑할 때 이름이 호스트명인 check 가 자동으로 만들어진다.
vault_healthchecks_ping_key: "<ping-key>"
