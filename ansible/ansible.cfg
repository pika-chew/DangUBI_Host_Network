[defaults]
inventory = ./inventory/hosts.yml
roles_path = ./roles
host_key_checking = True             ; 처음 보는 호스트 키는 거부 (known_hosts에 있어야 접속)
interpreter_python = auto_silent     ; 원격 파이썬 경로 자동 탐지, 경고 숨김
callback_result_format = yaml        ; 결과를 YAML로 출력
private_key_file = ~/.ssh/id_ed25519_ansible

[privilege_escalation]
become = True                        ; 모든 태스크를 sudo로 실행
become_method = sudo
become_ask_pass = True               ; 실행 시작 시 sudo 비밀번호를 한 번 물음 (-K 생략 가능)

[ssh_connection]
pipelining = True                    ; SSH 왕복을 줄여 속도 향상